# 身份。注册报文用这三项。
imei=
iccid=
firmware=HY-DG02

# 实验台直接填 MQTT。http_url 非空时，每次上线改向这个地址要主机和端口。
mqtt_host=
mqtt_port=1883
http_url=
# 空着表示不改模组里已有的 APN。
apn=

# 板上节点。通道号与 1V3 原理图一致，不要改路径。
n32_dev=/dev/mcu3
n32_baud=115200
rs485_dev=/dev/rs485
rs485_6_dev=/dev/rs485_6
rs485_baud=9600
gps_dev=/dev/gps
gps_baud=9600
at_dev=/dev/ttyUSB2
net_if=usb0
amp_gpio=0
voice_dir=/etc/hydg02/voice
