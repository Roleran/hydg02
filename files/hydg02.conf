# hydg02.conf - 设备配置
#
# 路径: /etc/hydg02/hydg02.conf (集成固件) 或 命令行参数指定 (独立部署)

# === 身份 ===
imei=860000000000001
fw_version=10.01.01

# === OTA 接入 ===
# ota_server: 协议 V3.0 4.1 接入信息 API 的 base_url
# ca_cert: 平台根证书 PEM (空 = 跳过 TLS, 仅调试用)
# sm2_pubkey: 平台 SM2 公钥 128字符hex (空 = 用编译时默认)
ota_server=
ca_cert=
sm2_pubkey=

# === 板上节点 (通道号与原理图一致) ===
n32_dev=/dev/mcu3
n32_baud=115200
rs485_dev=/dev/rs485
rs485_6_dev=/dev/rs485_6
rs485_baud=9600
gps_dev=/dev/gps
gps_baud=9600
at_dev=/dev/ttyUSB2
net_if=usb0
amp_gpio=

# === 语音 ===
# AB 变体: 独立 4MB JFFS2 分区 (init 脚本挂载到 /voice)
voice_dir=/voice
